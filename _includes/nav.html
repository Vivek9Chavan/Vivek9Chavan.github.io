<header class="site-header">
  <nav class="shell site-nav" aria-label="Main navigation">
    <a class="brand" href="{{ '/' | relative_url }}" {% if page.home %}aria-current="page"{% endif %}><img class="brand-avatar" src="{{ '/assets/images/vivek-chavan.jpg' | relative_url }}" alt="" width="36" height="36"><span>Vivek Chavan</span></a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="nav-links" type="button" hidden>Menu <span aria-hidden="true">+</span></button>
    <div class="nav-links" id="nav-links">
      {% for link in site.nav_links %}<a href="{{ link.url | relative_url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>{% endfor %}
      <a class="nav-cv" href="{{ '/cv.html' | relative_url }}">CV <span aria-hidden="true">↗</span></a>
    </div>
  </nav>
</header>
